<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMSA Kalotsav Poster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@700;800&family=Poppins:wght@600;700;800&display=swap');
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; color:#3a2208;
    font-family:'Anek Malayalam',system-ui,sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(255,180,40,.28), transparent 36%),
      radial-gradient(circle at 100% 10%, rgba(255,70,40,.18), transparent 40%),
      #ffe08a;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 12px 48px;
  }
  .bar{width:100%; max-width:720px; height:6px; border-radius:4px; margin-bottom:12px;
    background:linear-gradient(90deg,#ff3b1f,#ffb000 40%,#1aa0ff 75%,#7a3cff);}
  h1{font-size:18px; font-weight:800; margin:0 0 4px; text-align:center; color:#b42318;}
  p.sub{margin:0 0 12px; text-align:center; color:#7a4a12; font-size:13px;}
  .stage{width:100%; max-width:760px; border-radius:16px; overflow:hidden;
    box-shadow:0 16px 36px rgba(120,40,0,.22); background:#f4b000;}
  .stage canvas{display:block; width:100%; height:auto;}
  .cards{width:100%; max-width:760px; margin-top:14px; display:flex; flex-direction:column; gap:12px;}
  .card{background:#fffdf6; border-radius:16px; padding:14px 16px; border:1px solid #f0d59a;
    box-shadow:0 8px 18px rgba(120,50,0,.07); position:relative; overflow:hidden;}
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,#ff3b1f,#1aa0ff);}
  .card-head{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .num{width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#ff3b1f,#ffb000);
    color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;
    font-family:'Poppins',sans-serif; flex-shrink:0;}
  .ttl{font-size:14.5px; font-weight:800; color:#9a2a12;}
  label{display:block; font-size:12px; color:#7a4a12; font-weight:700; margin-bottom:6px;}
  input[type="text"], select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid #f0d59a; background:#fffaf0;
    font-family:'Poppins','Anek Malayalam',sans-serif; font-weight:800; font-size:15px; outline:none; color:#3a2208;
  }
  input:focus, select:focus{border-color:#e23b1a;}
  .btn{width:100%; padding:12px; border:none; border-radius:10px; font-weight:800; cursor:pointer;
    font-family:'Anek Malayalam',sans-serif;}
  .btn-photo{background:linear-gradient(135deg,#e23b1a,#ff8a00); color:#fff;}
  .btn-recrop{background:#fff1e4; color:#9a2a12; border:1.5px solid #f0c49a; margin-top:8px;}
  .btn-reset{background:#fff; color:#8a3a1a; border:1.5px solid #f0c7b0; margin-top:8px;}
  .btn-recrop:disabled,.btn-reset:disabled{opacity:.4; cursor:not-allowed;}
  .photo-row{display:flex; gap:10px; align-items:center;}
  .thumb{width:64px; height:72px; border-radius:14px; border:2px dashed #e8c07a; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#fff6e0; flex-shrink:0;}
  .thumb img{width:100%; height:100%; object-fit:cover;}
  .hint{font-size:11.5px; color:#8a5a22; margin-top:8px; line-height:1.45;}
  .prize-row{display:flex; gap:8px;}
  .prize-row button{
    flex:1; padding:10px 6px; border-radius:10px; border:1.5px solid #f0d59a; background:#fffaf0;
    font-family:'Poppins',sans-serif; font-weight:800; cursor:pointer; color:#7a4a12;
  }
  .prize-row button.on{background:linear-gradient(135deg,#e23b1a,#ff8a00); color:#fff; border-color:transparent;}
  .btn-download{background:linear-gradient(135deg,#9a2a12,#3b1208); color:#fff; font-size:15.5px; padding:15px;}
  #filePhoto{display:none;}
  .modal-backdrop{position:fixed; inset:0; background:rgba(40,16,0,.84); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .modal-backdrop.open{display:flex;}
  .modal-card{background:#fff; border-radius:18px; padding:20px; width:100%; max-width:380px; text-align:center;}
  .modal-card h2{margin:0 0 6px; color:#9a2a12; font-size:16px;}
  .crop-wrap{margin:0 auto 12px; border-radius:18px; overflow:hidden; background:#ffe7b0; touch-action:none; cursor:grab;}
  .crop-wrap canvas{display:block;}
  .zoom-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .zoom-row input{flex:1; accent-color:#e23b1a;}
  .modal-actions{display:flex; gap:10px;}
  .btn-cancel{background:#f4eee6; color:#5a4630;}
</style>
</head>
<body>
  <div class="bar"></div>
  <h1>PMSA Arts Fest Kalotsav 2026</h1>
  <p class="sub">ഫോട്ടോ, ഇനം, സ്ഥാനം, പേര് ചേർത്ത് പോസ്റ്റർ തയ്യാറാക്കൂ</p>
  <div class="stage"><canvas id="posterCanvas" width="2560" height="1440"></canvas></div>
  <div class="cards">
    <div class="card">
      <div class="card-head"><span class="num">1</span><span class="ttl">ഫോട്ടോ</span></div>
      <div class="photo-row">
        <div class="thumb" id="photoThumb">📷</div>
        <div style="flex:1">
          <button class="btn btn-photo" id="pickPhotoBtn">ഫോട്ടോ അപ്‌ലോഡ് ചെയ്യുക</button>
          <button class="btn btn-recrop" id="recropPhotoBtn" disabled>✂️ ക്രോപ്പ് ക്രമീകരിക്കുക</button>
          <button class="btn btn-reset" id="resetPhotoBtn" disabled>↺ റീസെറ്റ്</button>
        </div>
      </div>
      <p class="hint">വെള്ള ഫ്രെയിം മുഴുവൻ മറയും. നാല് വശവും നിറഞ്ഞ് വരും.</p>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">2</span><span class="ttl">ഇനം (Item)</span></div>
      <label for="itemInput">ഇനത്തിന്റെ പേര് — നീല ഭാഗത്ത് മധ്യത്തിൽ, ഡാർക്ക് മഞ്ഞ, സൈസ് 70</label>
      <input type="text" id="itemInput" maxlength="28" placeholder="ഉദാ: MAPPILAPPATTU / മാപ്പിളപ്പാട്ട്" autocomplete="off">
    </div>
    <div class="card">
      <div class="card-head"><span class="num">3</span><span class="ttl">Prize</span></div>
      <label>സ്ഥാനം തിരഞ്ഞെടുക്കുക</label>
      <div class="prize-row">
        <button type="button" data-prize="" class="on" id="pz0">None</button>
        <button type="button" data-prize="1" id="pz1">1st</button>
        <button type="button" data-prize="2" id="pz2">2nd</button>
        <button type="button" data-prize="3" id="pz3">3rd</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><span class="num">4</span><span class="ttl">പേര്</span></div>
      <label for="nameInput">കുട്ടിയുടെ പേര് — English CAPITAL മാത്രം, ഇനത്തിന് താഴെ</label>
      <input type="text" id="nameInput" maxlength="28" placeholder="STUDENT NAME" autocomplete="off" style="text-transform:uppercase">
    </div>
    <button class="btn btn-download" id="downloadBtn">⬇ പോസ്റ്റർ ഡൗൺലോഡ് ചെയ്യുക</button>
    <input type="file" id="filePhoto" accept="image/*">
  </div>

  <div class="modal-backdrop" id="cropModal">
    <div class="modal-card">
      <h2>ഫോട്ടോ ക്രോപ്പ് ചെയ്യുക</h2>
      <p style="color:#7a4a12;font-size:12px;margin:0 0 12px">വലിച്ചു നീക്കാം, സൂം ചെയ്യാം. ഫ്രെയിം മുഴുവൻ നിറയും.</p>
      <div class="crop-wrap" id="cropWrap"><canvas id="cropCanvas"></canvas></div>
      <div class="zoom-row"><span>➖</span><input type="range" id="zoomRange" min="100" max="350" value="100"><span>➕</span></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cropCancelBtn">റദ്ദാക്കുക</button>
        <button class="btn btn-photo" id="cropConfirmBtn">✔ ശരി</button>
      </div>
    </div>
  </div>

  const PHOTO = { cx: 416*S, cy: 436*S, w: 300*S, h: 334*S, radius: 52*S };
  const ITEM  = { x: 840*S, y: 392*S, maxW: 500*S, size: 70*S };
  const NAME  = { x: 840*S, y: 478*S, maxW: 500*S, size: 32*S };
  const BADGE = { x: 1178*S, y: 304*S, w: 232*S };

  let photoPlacement = null;
  let prize = '';

  function roundRectPath(c,x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    c.beginPath(); c.moveTo(x+rr,y);
    c.arcTo(x+w,y,x+w,y+h,rr); c.arcTo(x+w,y+h,x,y+h,rr);
    c.arcTo(x,y+h,x,y,rr); c.arcTo(x,y,x+w,y,rr); c.closePath();
  }
  function fitText(c, text, maxW, start, family, weight){
    let s = start;
    c.font = (weight||'800')+' '+s+'px '+family;
    while(c.measureText(text).width > maxW && s > 22){
      s -= 2; c.font = (weight||'800')+' '+s+'px '+family;
    }
    return s;
  }
  function draw(){
    ctx.clearRect(0,0,CW,CH);
    if(templateImg.complete && templateImg.naturalWidth)
      ctx.drawImage(templateImg, 0, 0, CW, CH);
    else { ctx.fillStyle='#f6b000'; ctx.fillRect(0,0,CW,CH); }

    if(photoPlacement){
      ctx.save();
      roundRectPath(ctx, PHOTO.cx-PHOTO.w/2, PHOTO.cy-PHOTO.h/2, PHOTO.w, PHOTO.h, PHOTO.radius);
      ctx.clip();
      ctx.drawImage(photoPlacement.img, PHOTO.cx+photoPlacement.x - photoPlacement.w*0.03, PHOTO.cy+photoPlacement.y - photoPlacement.h*0.03, photoPlacement.w*1.06, photoPlacement.h*1.06);
      ctx.restore();
    }

    const item = document.getElementById('itemInput').value.trim();
    if(item){
      ctx.save();
      ctx.fillStyle = '#FFE14A';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(20,40,90,.45)';
      ctx.shadowBlur = 6;
      fitText(ctx, item, ITEM.maxW, ITEM.size, '"Poppins","Anek Malayalam",sans-serif', '800');
      ctx.fillText(item, ITEM.x, ITEM.y);
      ctx.restore();
    }

    const name = document.getElementById('nameInput').value.trim();
    if(name){
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,40,120,.35)';
      ctx.shadowBlur = 6;
      fitText(ctx, name, NAME.maxW, NAME.size, '"Poppins",sans-serif', '800');
      ctx.fillText(name, NAME.x, NAME.y);
      ctx.restore();
    }

    if(prize && badges[prize] && badges[prize].complete && badges[prize].naturalWidth){
      const b = badges[prize];
      const bw = BADGE.w;
      const bh = bw * (b.naturalHeight / b.naturalWidth);
      ctx.drawImage(b, BADGE.x - bw/2, BADGE.y - bh/2, bw, bh);
    }
  }

  templateImg.onload = () => {
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    draw();
  };
  Object.values(badges).forEach(b => b.onload = draw);

  document.getElementById('itemInput').addEventListener('input', draw);
  document.getElementById('nameInput').addEventListener('input', e => {
    const el=e.target, caret=el.selectionStart;
    el.value = el.value.replace(/[^A-Za-z .'-]/g,'').toUpperCase();
    try{ el.setSelectionRange(caret,caret); }catch(err){}
    draw();
  });
  document.querySelectorAll('.prize-row button').forEach(btn => {
    btn.onclick = () => {
      prize = btn.dataset.prize;
      document.querySelectorAll('.prize-row button').forEach(b => b.classList.toggle('on', b===btn));
      draw();
    };
  });

  const cropModal=document.getElementById('cropModal');
  const cropCanvas=document.getElementById('cropCanvas');
  const cropCtx=cropCanvas.getContext('2d');
  const cropWrap=document.getElementById('cropWrap');
  const zoomRange=document.getElementById('zoomRange');
  let pendingImg=null, baseScale=1, zoom=1, panX=0, panY=0;
  let dragging=false, dsx=0, dsy=0, psx=0, psy=0;
  let PW=280, PH=300;

  function cur(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    return {x:PW/2-w/2+panX, y:PH/2-h/2+panY, w, h};
  }
  function clamp(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    const mx=Math.max(0,(w-PW)/2), my=Math.max(0,(h-PH)/2);
    panX=Math.min(mx,Math.max(-mx,panX)); panY=Math.min(my,Math.max(-my,panY));
  }
  function drawCrop(){
    cropCtx.clearRect(0,0,PW,PH);
    cropCtx.save();
    roundRectPath(cropCtx,0,0,PW,PH, PHOTO.radius*(PW/PHOTO.w));
    cropCtx.clip();
    cropCtx.fillStyle='#ffe7b0'; cropCtx.fillRect(0,0,PW,PH);
    if(pendingImg){ const d=cur(); cropCtx.drawImage(pendingImg,d.x,d.y,d.w,d.h); }
    cropCtx.restore();
  }
  function openCrop(img){
    pendingImg=img;
    PW=280; PH=Math.round(280*(PHOTO.h/PHOTO.w));
    cropCanvas.width=PW; cropCanvas.height=PH;
    cropWrap.style.width=PW+'px'; cropWrap.style.height=PH+'px';
    baseScale=Math.max(PW/img.width, PH/img.height);
    zoom=1; panX=0; panY=0; zoomRange.value=100;
    drawCrop(); cropModal.classList.add('open');
  }
  cropWrap.addEventListener('pointerdown', e => {
    if(!pendingImg) return;
    dragging=true; cropWrap.setPointerCapture(e.pointerId);
    dsx=e.clientX; dsy=e.clientY; psx=panX; psy=panY;
  });
  cropWrap.addEventListener('pointermove', e => {
    if(!dragging) return;
    panX=psx+(e.clientX-dsx); panY=psy+(e.clientY-dsy); clamp(); drawCrop();
  });
  cropWrap.addEventListener('pointerup', ()=>dragging=false);
  cropWrap.addEventListener('pointercancel', ()=>dragging=false);
  zoomRange.addEventListener('input', ()=>{ zoom=parseInt(zoomRange.value,10)/100; clamp(); drawCrop(); });
  document.getElementById('cropCancelBtn').onclick=()=>cropModal.classList.remove('open');
  document.getElementById('cropConfirmBtn').onclick=()=>{
    const d=cur(); const mapX=PHOTO.w/PW, mapY=PHOTO.h/PH;
    photoPlacement={ img:pendingImg, x:(d.x-PW/2)*mapX, y:(d.y-PH/2)*mapY, w:d.w*mapX, h:d.h*mapY };
    document.getElementById('recropPhotoBtn').disabled=false;
    document.getElementById('resetPhotoBtn').disabled=false;
    const thumb=document.getElementById('photoThumb'); thumb.innerHTML='';
    const im=document.createElement('img'); im.src=pendingImg.src; thumb.appendChild(im);
    cropModal.classList.remove('open'); draw();
  };

  const filePhoto=document.getElementById('filePhoto');
  document.getElementById('pickPhotoBtn').onclick=()=>filePhoto.click();
  filePhoto.addEventListener('change', e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{ const img=new Image(); img.onload=()=>openCrop(img); img.src=ev.target.result; };
    r.readAsDataURL(file); filePhoto.value='';
  });
  document.getElementById('recropPhotoBtn').onclick=()=>{ if(photoPlacement) openCrop(photoPlacement.img); };
  document.getElementById('resetPhotoBtn').onclick=()=>{
    photoPlacement=null; document.getElementById('photoThumb').innerHTML='📷';
    document.getElementById('recropPhotoBtn').disabled=true;
    document.getElementById('resetPhotoBtn').disabled=true; draw();
  };
  document.getElementById('downloadBtn').onclick=()=>{
    draw();
    const nm=(document.getElementById('nameInput').value.trim()||'poster').replace(/\s+/g,'_');
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='pmsa-kalotsav-'+nm+'.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    },'image/jpeg',0.92);
  };
})();
</script>
</body>
</html>
